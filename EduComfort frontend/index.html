<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>EduComfort — Smart Learning Management Platform</title>
  <meta name="description"
    content="EduComfort is an all-in-one EdTech SaaS platform for learning centers. Manage students, teachers, groups, payments, exams, and more in one place." />
  <meta name="theme-color" content="#1890ff" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://educomfort.uz/" />
  <meta property="og:title" content="EduComfort — Smart Learning Management Platform" />
  <meta property="og:description"
    content="An all-in-one EdTech SaaS for learning centers — students, teachers, groups, exams, and payments, all in one place." />
  <meta property="og:image" content="https://educomfort.uz/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="EduComfort — Smart Learning Management Platform" />
  <meta name="twitter:description" content="An all-in-one EdTech SaaS for learning centers." />
  <meta name="twitter:image" content="https://educomfort.uz/og-image.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://educomfort.uz/" />

  <!-- Google Analytics 4
       The GA_ID is set as an env var VITE_GA_MEASUREMENT_ID in .env.production.
       In local dev (where it is not set) this whole block is a safe no-op.   -->
  <script>
    // Vite replaces %VITE_GA_MEASUREMENT_ID% at build time.
    var _gaId = "%VITE_GA_MEASUREMENT_ID%";
    if (_gaId && _gaId.indexOf("%") === -1) {
      var _s = document.createElement("script");
      _s.async = true;
      _s.src = "https://www.googletagmanager.com/gtag/js?id=" + _gaId;
      document.head.appendChild(_s);
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag("js", new Date());
      // send_page_view: false — we fire page_view manually on route changes in App.jsx
      gtag("config", _gaId, { send_page_view: false });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
