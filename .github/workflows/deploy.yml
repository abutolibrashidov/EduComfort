name: EduComfort CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend – Lint & Test
    runs-on: ubuntu-latest
    env:
      # Set these in GitHub → Settings → Secrets and variables → Actions.
      # When missing, the next step falls back to a throwaway SQLite DB and CI key.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set CI defaults for missing secrets
        run: |
          echo "DATABASE_URL=${DATABASE_URL:-sqlite:///./test.db}" >> $GITHUB_ENV
          echo "SECRET_KEY=${SECRET_KEY:-ci-test-secret-key-not-for-production-64chars}" >> $GITHUB_ENV

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev \
            poppler-utils tesseract-ocr \
            libpq-dev

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Check imports (smoke test)
        run: |
          python -c "from app.core.config import settings; print('✅ Config OK')"
          python -c "from app.core.database import engine; print('✅ DB engine OK')"
          python -c "from app.main import app; print('✅ FastAPI app OK')"

      - name: Run pytest (if api tests exist)
        run: |
          if find Tests -name "test_api_*.py" -o -name "*_test.py" | grep -q .; then
            pip install pytest pytest-cov
            pytest Tests/ -v --tb=short -k "not Integration"
          else
            echo "⚠️  No pytest API test files found — skipping. Add Tests/test_api_*.py to enable."
          fi

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint (warnings only)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: |
          VITE_API_URL="${VITE_API_URL:-http://localhost:8000}" npm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          VITE_API_URL: "http://localhost:8000"

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Uncomment for Railway backend:
      # - name: Deploy backend
      #   uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: educomfort-backend

      # Uncomment for Vercel frontend:
      # - name: Deploy frontend
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: frontend

      - name: CI passed
        run: echo "✅ All checks passed. Configure deploy steps above for your provider."
